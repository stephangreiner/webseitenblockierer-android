name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list contains the removed "tools" package,
          # which makes sdkmanager fail. Install only platform-tools here.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Webseitenblockierer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Webseitenblockierer Android (latest build)
          body: |
            Automatisch gebaute Debug-APK.
            Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben).
            Danach in den Einstellungen "Bedienungshilfe" und "Über anderen Apps anzeigen" für die App aktivieren.
          files: app/build/outputs/apk/debug/app-debug.apk
